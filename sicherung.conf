@echo off

:: ############################################################
:: SICHERUNGSKONFIGURATION
:: ############################################################

:: Pfad zu 7-Zip
set "programmpfad=C:\Program Files\7-Zip\7z.exe"

:: Quellpfad
set "quelle=D:\Backup\Datenquelle"

:: Zielpfad
set "ziel=D:\Backup\Backup"

:: ------------------- TESTSYSTEM -------------------

:: 1 = aktiv
:: 0 = deaktiviert
set testsystem=0

set "testsystempfad=D:\Testsystem"

:: ------------------- GIT-KOPIE -------------------

:: 1 = aktiv
:: 0 = deaktiviert
set git=0

set "gitdatei=meinedatei.ext"
set "gitpfad=D:\GitRepo"

:: ------------------- SICHERUNGEN -------------------

:: 1 = aktiviert
:: 0 = deaktiviert
set monatssicherung=1
set jahressicherung=1

:: ------------------- AUFBEWAHRUNG -------------------

:: Tagessicherungen in Tagen
set aufbewahrungszeit=31

:: Monatssicherungen nach einem Jahr löschen
set monataelteralseinjahrloeschen=1

:: Mindestalter in Tagen
set minAlter=365